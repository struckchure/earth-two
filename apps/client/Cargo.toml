[package]
name = "earth-two-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_log", "bevy_state", "bevy_scene", "bevy_asset", "bevy_animation", "keyboard"] }
avian3d.workspace = true
earth-two-world.workspace = true
earth-two-identity.workspace = true
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rodio = { version = "=0.22.2", default-features = false, optional = true }

# The real clock in the browser, where std's SystemTime panics (sky/time.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "=1.1.0"
# Browser identity storage, file chooser and download (identity/storage.rs).
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["Window", "Storage", "Document", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "Element", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "Location", "UrlSearchParams", "AudioContext", "AudioContextState", "CssStyleDeclaration", "Node"] }

[features]
default = ["viewer"]
viewer = ["bevy/system_clipboard", "bevy/3d", "bevy/ui", "bevy/jpeg", "bevy/png", "bevy/bevy_gltf", "bevy/gltf_animation", "bevy/bevy_audio", "bevy/wav", "bevy/vorbis", "dep:rodio"]

[[example]]
name = "sky"
required-features = ["viewer"]

[[example]]
name = "shading"
required-features = ["viewer"]

[[example]]
name = "presentation"
required-features = ["viewer"]

[[example]]
name = "vehicle"
required-features = ["viewer"]

[[example]]
name = "game_smoke"
required-features = ["viewer"]

[[example]]
name = "injury_smoke"
required-features = ["viewer"]

[[example]]
name = "crowd_smoke"
required-features = ["viewer"]

[[example]]
name = "ambience_smoke"
required-features = ["viewer"]

[[example]]
