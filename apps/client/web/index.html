<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Earth Two — Rust foundation</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #382933; }
      canvas { display: block; width: 100%; height: 100%; }
      #error { position: absolute; top: 1rem; left: 1rem; color: white; font: 1rem sans-serif; }
    </style>
  </head>
  <body>
    <canvas id="earth-two" aria-label="Earth Two foundation scene"></canvas>
    <p id="error" hidden></p>
    <script type="module">
      import init from './earth_two_client.js';
      try {
        await init();
      } catch (error) {
        const message = document.querySelector('#error');
        message.textContent = `Unable to start Earth Two: ${error.message ?? error}`;
        message.hidden = false;
      }
    </script>
  </body>
</html>
