[workspace]
members = ["apps/client", "crates/identity", "crates/world"]
exclude = ["internals/server/module"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
earth-two-world = { path = "crates/world" }
earth-two-identity = { path = "crates/identity" }
bevy_math = "=0.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
bevy = { version = "=0.20.0", default-features = false }
avian3d = { git = "https://github.com/avianphysics/avian.git", rev = "34c9b008d2f40638a953d9218db48d54f661365d", default-features = false, features = ["3d", "parry-f32"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
