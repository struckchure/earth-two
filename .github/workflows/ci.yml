name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run it by hand, on any branch, from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

env:
  # The emscripten release web builds use.
  EMSDK_VERSION: 6.0.10
  OTA_RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  OTA_GAME_VERSION: ${{ vars.OTA_GAME_VERSION || github.sha }}
  SOURCE_COMMIT: ${{ github.sha }}
  APP_VERSION: ${{ vars.APP_VERSION || '0.1.0' }}

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # Windows builds use the MinGW-w64 gcc on the runner's PATH.
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # raylib's headers on Linux: OpenGL, and GLFW's X11 and Wayland backends.
      - name: Install raylib's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev dpkg-dev
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        run: |
          choco install nsis --no-progress -y
          echo 'C:/Program Files (x86)/NSIS' >> "$GITHUB_PATH"
      - name: Prepare native dependencies
        run: go run ./tools/deps
      - name: Vet
        run: GOWORK="$GITHUB_WORKSPACE/build/deps/native.work" go vet ./...
      - name: Test
        run: GOWORK="$GITHUB_WORKSPACE/build/deps/native.work" go test ./...
      - name: Test installers
        run: python -m unittest discover -s tools/desktop -p 'test_*.py' -v
      - name: Create build env file
        if: github.event_name != 'pull_request'
        uses: albesja11/create-envfile@413ca0239169a9101979b5494150c89e220d2465 # Node 24; upstream PR 182
        env:
          INPUT_ENVKEY_SPACETIMEDB_SERVER: ${{ secrets.SPACETIMEDB_SERVER }}
          INPUT_ENVKEY_SPACETIMEDB_DATABASE: ${{ secrets.SPACETIMEDB_DATABASE }}
        with:
          file_name: .env
          fail_on_empty: true
      # go build rather than make build: Windows runners don't have make.
      - name: Build
        run: |
          if [ "$RUNNER_OS" = 'Windows' ]; then
            export GOFLAGS="${GOFLAGS:-} -ldflags=-H=windowsgui"
          fi
          GOWORK="$GITHUB_WORKSPACE/build/deps/native.work" go run ./tools/buildenv go build -o "build/earth-two$(go env GOEXE)" ./cmd/desktop
      - name: Remove build env file
        if: always()
        run: rm -f .env
      # The game loads the packed assets folder beside the executable.
      - name: Pack the runtime assets
        run: go run ./tools/assetpack
      - name: Package installers
        run: python tools/desktop/package.py --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --version "$APP_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/dist/
          if-no-files-found: error
      - name: Package OTA release
        run: |
          platform="$(go env GOOS)-$(go env GOARCH)"
          python tools/ota/release.py package --root build --out "build/ota/$platform" \
            --platform "$platform" --release-id "$OTA_RELEASE_ID" \
            --commit "$SOURCE_COMMIT" --version "$OTA_GAME_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: earth-two-${{ runner.os }}-${{ matrix.arch }}
          path: |
            build/earth-two*
            build/assets/
      - uses: actions/upload-artifact@v7
        with:
          name: ota-${{ runner.os }}-${{ matrix.arch }}
          path: build/ota/
          if-no-files-found: error

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      # raylib and Jolt compiled with emscripten, which only change with
      # illusion's version (in go.sum).
      - name: Cache the compiled C libraries
        uses: actions/cache@v6
        with:
          path: ~/.cache/illusion/web
          key: illusion-web-${{ env.EMSDK_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: illusion-web-${{ env.EMSDK_VERSION }}-
      - name: Test build configuration
        run: go test ./tools/buildenv
      - name: Create build env file
        if: github.event_name != 'pull_request'
        uses: albesja11/create-envfile@413ca0239169a9101979b5494150c89e220d2465 # Node 24; upstream PR 182
        env:
          INPUT_ENVKEY_SPACETIMEDB_SERVER: ${{ secrets.SPACETIMEDB_SERVER }}
          INPUT_ENVKEY_SPACETIMEDB_DATABASE: ${{ secrets.SPACETIMEDB_DATABASE }}
        with:
          file_name: .env
          fail_on_empty: true
      - name: Build for the browser
        run: make web
      - name: Remove build env file
        if: always()
        run: rm -f .env
      - name: Package OTA release
        run: |
          python tools/ota/release.py package --root build/web --out build/ota/web \
            --platform web --release-id "$OTA_RELEASE_ID" \
            --commit "$SOURCE_COMMIT" --version "$OTA_GAME_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: earth-two-web
          path: build/web
      - uses: actions/upload-artifact@v7
        with:
          name: ota-web
          path: build/ota/
          if-no-files-found: error

  release-tools:
    name: Validate OTA tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test packaging and publishing
        run: python -m unittest discover -s tools/ota -p 'test_*.py' -v
      - name: Validate storage template
        run: |
          python -m pip install cfn-lint==1.57.2
          cfn-lint infra/ota-storage.json

  publish-updates:
    name: Publish OTA releases
    needs: [desktop, web, release-tools]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.OTA_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ota-release
    concurrency:
      group: earth-two-ota-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Skip superseded main builds
        id: fresh
        shell: bash
        run: |
          current_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$current_head" ]; then
            echo 'Could not resolve main' >&2
            exit 1
          fi
          if [ "$current_head" = "$SOURCE_COMMIT" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit exists; skipping release promotion.'
          fi
      - uses: actions/download-artifact@v8
        if: steps.fresh.outputs.publish == 'true'
        with:
          pattern: ota-*
          merge-multiple: true
          path: build/ota-incoming
      - name: Merge tested platform releases
        if: steps.fresh.outputs.publish == 'true'
        run: |
          python tools/ota/release.py merge --root build/ota-incoming \
            --out build/ota-release --require-all
      - name: Create publisher env file
        if: steps.fresh.outputs.publish == 'true'
        uses: albesja11/create-envfile@413ca0239169a9101979b5494150c89e220d2465 # Node 24; upstream PR 182
        env:
          INPUT_ENVKEY_AWS_S3_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          INPUT_ENVKEY_AWS_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
          INPUT_ENVKEY_AWS_S3_SESSION_TOKEN: ${{ secrets.AWS_S3_SESSION_TOKEN }}
          INPUT_ENVKEY_AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
          INPUT_ENVKEY_AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
          INPUT_ENVKEY_AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          INPUT_ENVKEY_AWS_S3_PUBLIC_URL: ${{ secrets.AWS_S3_PUBLIC_URL }}
          INPUT_ENVKEY_OTA_S3_PREFIX: ${{ secrets.OTA_S3_PREFIX }}
          INPUT_ENVKEY_SPACETIMEDB_SERVER: ${{ secrets.SPACETIMEDB_SERVER }}
          INPUT_ENVKEY_SPACETIMEDB_DATABASE: ${{ secrets.SPACETIMEDB_DATABASE }}
          INPUT_ENVKEY_SPACETIMEDB_PUBLISH_TOKEN: ${{ secrets.SPACETIMEDB_PUBLISH_TOKEN }}
        with:
          file_name: .env
          # Temporary session credentials are optional; the publisher validates required values.
          fail_on_empty: false
      - name: Upload S3 assets and promote manifest
        if: steps.fresh.outputs.publish == 'true'
        env:
          OTA_RELEASE_CHANNEL: ${{ vars.OTA_RELEASE_CHANNEL || 'beta' }}
        run: |
          python tools/ota/release.py publish --root build/ota-release \
            --channel "$OTA_RELEASE_CHANNEL"
      - name: Remove publisher env file
        if: always()
        run: rm -f .env
