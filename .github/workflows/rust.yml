name: Rust client

on:
  pull_request:
    paths: ['apps/**', 'crates/**', 'vendor/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'tools/rust/**', '.github/workflows/rust.yml']
  push:
    branches: [main]
    paths: ['apps/**', 'crates/**', 'vendor/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'tools/rust/**', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev libxkbcommon-dev libwayland-dev
      - name: Install pinned toolchain
        shell: bash
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: World, physics and scene tests
        run: cargo test --locked --workspace --no-default-features
      - name: Terrain renderer regression
        run: cargo test --locked -p earth-two-client --lib relocated_chunks
      - name: Native client
        run: cargo check --locked -p earth-two-client --all-targets
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Browser client
        if: runner.os == 'Linux'
        run: cargo check --locked -p earth-two-client --target wasm32-unknown-unknown

